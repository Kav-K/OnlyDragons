name: OnlyDragons
version: '${version}'
main: com.kaveenk.onlydragons.OnlyDragonsPlugin
api-version: '${apiVersion}'
description: Main workspace for Minecraft Java plugin development.
commands:
  onlydragons:
    description: Inspect stats, grant calibration gear, and manage plugin configuration.
    usage: /onlydragons [status|reload|stats|combat|dev]
    aliases: [mcdev]
    permission: onlydragons.use
permissions:
  onlydragons.use:
    description: Use the OnlyDragons status command.
    default: true
  onlydragons.admin:
    description: Reload OnlyDragons configuration.
    default: op
  onlydragons.stats:
    description: Inspect your current equipment stats and sources.
    default: true
  onlydragons.calibration:
    description: Grant yourself calibration bows and session stat bonuses.
    default: op
  onlydragons.fire:
    description: Fire managed bows inside admitted OnlyDragons arenas.
    default: true
  onlydragons.combat:
    description: Inspect your last combat hit and captured inputs.
    default: true
  onlydragons.practice:
    description: Grant practice kits and create or reset your practice target.
    default: op
