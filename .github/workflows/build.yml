name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned JDK version
        id: versions
        shell: bash
        run: echo "java=$(sed -n 's/^javaVersion=//p' versions.properties | tr -d '\r')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.versions.outputs.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test, and generate coverage
        shell: bash
        run: bash ./gradlew build --console=plain
      - name: Compile the isolated Paper test companion
        shell: bash
        run: bash ./gradlew -p dev/game-tests build --console=plain
      - name: Build and verify the isolated protocol player
        shell: bash
        run: bash ./gradlew -p dev/player-client build installDist --dependency-verification strict --console=plain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify runner failure and provenance contracts
        shell: bash
        run: python -m unittest discover -s scripts/agent-tests -p 'test_*.py' -v
      - name: Check fixture coverage, task dependencies and milestone gates
        shell: bash
        run: python scripts/agent-tests/checkpoint.py plan --project .
      - name: Verify Symphony worker protocol and sandbox boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: python -m unittest discover -s scripts/symphony/tests -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnlyDragons-${{ matrix.os }}
          path: |
            build/libs/*.jar
            build/reports/tests/
            build/reports/jacoco/
  paper-integration:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: onlydragons-manual-paper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The helper provisions the exact checksum-pinned JDK archive. setup-java's
      # SemVer parser does not support the existing four-part 25.0.4.1+1 release.
      - name: Provision the pinned JDK, run and replay the complete Paper suite
        env:
          ONLYDRAGONS_PAPER_EULA_BASE64: ${{ vars.ONLYDRAGONS_PAPER_EULA_BASE64 }}
        shell: bash
        run: |
          python scripts/agent-tests/ci_paper.py run \
            --checkout "$GITHUB_WORKSPACE" --revision "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --output "$RUNNER_TEMP/onlydragons-paper-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnlyDragons-Paper-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/onlydragons-paper-evidence/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
